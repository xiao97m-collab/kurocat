[package]
name = "kuro-cat-pet"
version = "1.2.0"
description = "Cross-platform desktop cat typing & mouse companion for Windows and macOS"
authors = ["Kevin Hao"]
edition = "2021"

[lib]
name = "kuro_cat_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "KuroCat"
path = "src/main.rs"

[features]
default = []
layout-108 = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
